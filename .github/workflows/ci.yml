name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test release version policy
        run: bash scripts/test-release-version.sh
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - run: npm ci
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: go test -race ./...
      - run: go vet ./...
      - name: Package Linux binaries
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          test -s web/dist/index.html
          out="$RUNNER_TEMP/aicdk-artifacts"
          mkdir -p "$out"
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/cdk" ./cmd/server
            tar -czf "$out/aicdk-linux-$arch.tar.gz" -C "$RUNNER_TEMP" cdk
          done
          cd "$out"
          sha256sum aicdk-linux-*.tar.gz > SHA256SUMS
      - name: Upload Linux binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aicdk-linux-${{ github.sha }}
          path: ${{ runner.temp }}/aicdk-artifacts/
          if-no-files-found: error
          compression-level: 0
          overwrite: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build container for smoke testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: aicdk:ci
          cache-from: type=gha,scope=aicdk
          cache-to: type=gha,mode=max,scope=aicdk
      - name: Container health smoke test
        run: |
          trap 'docker rm -fv aicdk-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name aicdk-ci \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount type=volume,dst=/data \
            -e CDK_PARTNER_PASSWORD="$(openssl rand -hex 24)" \
            -e CDK_UPSTREAM_URL=https://127.0.0.1:1 \
            aicdk:ci
          for _ in $(seq 1 20); do
            if docker exec aicdk-ci /app/cdk healthcheck; then exit 0; fi
            sleep 1
          done
          docker logs aicdk-ci
          exit 1
