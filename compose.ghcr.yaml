services:
  cdk:
    image: "${CDK_IMAGE:-ghcr.io/akinokaede/aicdk:latest}"
    restart: unless-stopped
    env_file: .env
    environment:
      LISTEN_ADDR: ":8080"
      DATA_DIR: /data
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    volumes:
      - cdk-data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 170s
    init: false

volumes:
  cdk-data:
